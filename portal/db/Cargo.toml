[package]
name = "portal-db"
version.workspace = true
edition.workspace = true

[features]
default = ["sqlite"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm/sqlite-use-returning-for-3_35"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm/runtime-tokio-rustls"]

[dependencies]
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio"] }

[lints.rust]
unsafe_code = "forbid"
