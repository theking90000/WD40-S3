[package]
name = "portal"
version.workspace = true
edition.workspace = true

[features]
default = []
cli = ["dep:clap"]
embed-console = ["dep:vite-rs"]
standalone = ["cli", "embed-console", "dep:tokio"]

[[bin]]
name = "portal"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
hyper-util = { version = "0.1.21", features = ["service"] }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }
vite-rs = { version = "0.3.0", default-features = false, features = ["debug-prod", "content-hash"], optional = true }

[lints.rust]
unsafe_code = "forbid"
