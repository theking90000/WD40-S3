[package]
name = "portal"
version.workspace = true
edition.workspace = true

[features]
default = ["sqlite"]
verified-email = []
sqlite = ["portal-db/sqlite"]
postgres = ["portal-db/postgres"]
cli = ["dep:clap", "s3-credentials-registry/cli", "policy-registry/cli"]
grpc-client = ["s3-credentials-registry/grpc-client", "policy-registry/grpc-client", "blob-registry?/grpc-client", "file-registry?/grpc-client", "stream-registry?/grpc-client", "object-registry?/grpc-client", "s3-multipart-registry?/grpc-client"]
grpc-tls = ["grpc-client", "s3-credentials-registry/grpc-tls", "policy-registry/grpc-tls", "blob-registry?/grpc-tls", "file-registry?/grpc-tls", "stream-registry?/grpc-tls", "object-registry?/grpc-tls", "s3-multipart-registry?/grpc-tls"]
embed-console = ["dep:rust-embed"]
standalone = ["cli", "embed-console", "tokio/macros", "tokio/rt-multi-thread", "tokio/net", "tokio/signal"]
embedded-s3 = ["dep:s3-adapter", "dep:access-controller", "dep:backends", "dep:blob-system", "dep:blob-registry", "dep:file-registry", "dep:stream-registry", "dep:object-registry", "dep:s3-multipart-registry", "dep:hyper", "dep:tokio-tcp-pool", "dep:webpki-roots", "hyper-util/tokio", "hyper-util/http1", "hyper-util/server-graceful"]

[[bin]]
name = "portal"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
portal-db = { path = "db", default-features = false }
s3-credentials-registry = { path = "../crates/s3-credentials-registry", default-features = false }
policy-registry = { path = "../crates/policy-registry", default-features = false }
s3-adapter = { path = "../crates/s3-adapter", default-features = false, features = ["cli"], optional = true }
access-controller = { path = "../crates/access-controller", optional = true }
backends = { path = "../crates/backends", default-features = false, features = ["discord", "cli"], optional = true }
blob-system = { path = "../crates/blob-system", optional = true }
blob-registry = { path = "../crates/blob-registry", default-features = false, features = ["cli"], optional = true }
file-registry = { path = "../crates/file-registry", default-features = false, features = ["cli"], optional = true }
stream-registry = { path = "../crates/stream-registry", default-features = false, features = ["cli"], optional = true }
object-registry = { path = "../crates/object-registry", default-features = false, features = ["cli"], optional = true }
s3-multipart-registry = { path = "../crates/s3-multipart-registry", default-features = false, features = ["cli"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
tokio-tcp-pool = { version = "0.1.3", optional = true }
webpki-roots = { version = "1", optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
openidconnect = "=4.0.1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
getrandom = "0.4"
subtle = "2.6"
time = { version = "0.3", default-features = false }
hyper-util = { version = "0.1.21", features = ["service"] }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
tokio = { version = "1.53.3", default-features = false, features = ["sync", "time"] }
rust-embed = { version = "8.13.0", default-features = false, features = ["debug-embed", "mime-guess"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
