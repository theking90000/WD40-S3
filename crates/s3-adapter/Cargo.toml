[package]
name = "s3-adapter"
version.workspace = true
edition.workspace = true

[features]
default = []
cli = ["dep:clap", "blob-system/cli"]
standalone = ["cli", "dep:hyper", "dep:hyper-util", "dep:tokio", "dep:tokio-tcp-pool", "dep:webpki-roots", "dep:backends", "backends/cli", "dep:blob-registry", "blob-registry/cli", "dep:file-registry", "file-registry/cli", "dep:stream-registry", "stream-registry/cli", "dep:policy-registry", "policy-registry/cli", "object-registry/cli", "s3-credentials-registry/cli"]

[[bin]]
name = "s3-adapter"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
access-controller = { path = "../access-controller" }
blob-system = { path = "../blob-system" }
object-registry = { path = "../object-registry" }
s3-credentials-registry = { path = "../s3-credentials-registry" }
backends = { path = "../backends", optional = true }
blob-registry = { path = "../blob-registry", optional = true }
file-registry = { path = "../file-registry", optional = true }
stream-registry = { path = "../stream-registry", optional = true }
policy-registry = { path = "../policy-registry", optional = true }
s3s = "0.17"
clap = { version = "4", features = ["derive", "env"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-graceful"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }
tokio-tcp-pool = { version = "0.1.3", optional = true }
webpki-roots = { version = "1", optional = true }

[lints.rust]
unsafe_code = "forbid"
