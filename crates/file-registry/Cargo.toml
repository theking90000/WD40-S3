[package]
name = "file-registry"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
backends = { path = "../backends" }
futures-core = "0.3"
sled = "0.34.7"
postcard = { version = "1.1.3", features = ["alloc"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
