[package]
name = "file-registry"
version.workspace = true
edition.workspace = true

[features]
default = []
cli = ["dep:clap", "backends/cli", "dep:tokio-tcp-pool", "dep:webpki-roots"]

grpc-client = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tonic-prost-build", "tonic/codegen", "tonic/channel"]
grpc-server = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tonic-prost-build", "dep:tokio", "tonic/codegen", "tonic/server", "tonic/router"]
grpc-tls = ["tonic?/tls-ring", "tonic?/tls-native-roots"]

[[bin]]
name = "file-registry"
path = "src/main.rs"
required-features = ["cli", "grpc-server"]

[dependencies]
clap = { version = "4", features = ["derive", "env"], optional = true }
serde = { version = "1", features = ["derive"] }
backends = { path = "../backends" }
futures-core = "0.3"
futures-channel = "0.3"
sled = "0.34.7"
postcard = { version = "1.1.3", features = ["alloc"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

tonic = { version = "0.14", default-features = false, optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
tokio = { version = "1", features = ["macros", "rt", "signal"], optional = true }

tokio-tcp-pool = { version = "0.1.3", optional = true }
webpki-roots = { version = "1", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
futures-executor = "0.3"
tokio-tcp-pool = "0.1.3"
discord-webhook-storage = "0.1.0"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
